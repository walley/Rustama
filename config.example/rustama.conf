# Rustama configuration

# Ollama API URL
ollama_url = http://localhost:11434

# Default model (Ollama tag or a section name from models_cloud.conf)
model = llama3.2:3b

# Default save path for /save and exports
save_path = output.md

# Enable agentic mode on startup (true/false) — legacy, superseded by `mode`
agentic = true

# Startup workflow mode: chat, coder, or assistant
mode = coder

# HTTP request timeout in seconds
timeout_secs = 300

# Enable logging on startup (true/yes/on or false/no/off)
logging = true

# Log file path (empty = <session_dir>/logs/rustama-<instance>.log)
logfile = rustama.log

# System prompt for Coder mode. A value naming an existing file is loaded
# from <config dir>/<file>; otherwise the value itself is the prompt text.
system_prompt_coder = coder.prompt

# System prompt for Assistant mode (same file/inline rule)
system_prompt_assistant = assistant.prompt

# HTTP proxy URL (optional — uncomment to route requests through a proxy)
# proxy = http://proxy:8080

# Max agentic tool rounds per request (default: 100)
max_tool_rounds = 100

# Max automatic continue nudges per user turn (0 disables, default: 10)
max_auto_continues = 10

# Max API retries on 429/rate-limit errors (1–50, default: 10)
max_retries = 10

# Terminal panel width as a percentage of the screen (20–80, default: 40)
terminal_width_pct = 40

# Justify paragraphs in output (true/false, default: false)
justify = false

# Show the hint bar above the keybar (on/off, default: off)
hintbar = off

# Launch rust-analyzer LSP for compiler feedback (on/off, default: off —
# it is a heavy process)
lsp = off

# LSP server binary — a name on $PATH or an absolute path
lsp_server = rust-analyzer

# LSP workspace root (default: directory of save_path, else the cwd)
lsp_workspace =

# Append fresh LSP diagnostics to edit_file/write_file results (default: on)
lsp_auto_diagnostics = on

# Directory for session files (default: <DOCUMENTS>/rustama)
session_dir =

# Directory for log files (default: <session_dir>/logs)
log_directory = logs

# Optional colour theme: <name> loads <config dir>/<name>.theme
# theme = example

# NOTE: model parameters (temperature, top_p, top_k, frequency_penalty,
# presence_penalty, max_output_tokens, reasoning_effort, seed, num_ctx) are
# per-model — see models_ollama.conf (Ollama) and models_cloud.conf (cloud).
