# Cloud models configuration (OpenAI-compatible APIs)
#
# [default] applies to every cloud model; a named section overrides what it
# sets. Required per model section: api_url, api_key. Optional: api_model
# (actual model name sent to the API, defaults to the section name), plus any
# model parameter and pricing key.
#
# provider_api selects which API protocol the model speaks:
#   openai (default) — OpenAI-compatible chat/completions API (SSE,
#     `choices[].delta.content`, Bearer auth).
#   ollama — Ollama chat API (raw JSON lines, `message.content`,
#     optional Bearer auth, `options` map for params). Use this for
#     Ollama-compatible endpoints such as https://ollama.com/api/chat.
#
# reasoning_param selects which request field carries the reasoning toggle:
#   reasoning_effort (default) — top-level `reasoning_effort` = low/medium/high
#   think                      — top-level `think` = true/false (Mistral API)
#   none                       — never send a reasoning parameter
#
# Any parameter line may carry a Cisco-style send-policy prefix in front
# of the parameter name:
#   no reasoning_effort          — never send the parameter
#   once reasoning_effort = high — send it only on the first request of a
#                                  session; every other request omits it
#   reasoning_effort = high      — send on every request (default)
# Example: NVIDIA NIM rejects `reasoning_effort` on follow-up requests that
# replay reasoning history (hard 400), so Mistral Large on NVIDIA NIM needs
#   once reasoning_effort = high
#
# Sections whose api_key still starts with YOUR_ are ignored, so this file is
# safe to keep as-is until you fill in a real key.

[default]
tool_choice = auto
reasoning_effort = high
temperature = 1
top_p = 0.9
top_k = 40
frequency_penalty = 0
presence_penalty = 0

# Example: a Mistral-hosted reasoning model. api.mistral.ai rejects the
# OpenAI-style `reasoning_effort` field (HTTP 422) and expects `think` instead.
[magistral]
api_url = https://api.mistral.ai/v1/chat/completions
api_key = YOUR_MISTRAL_API_KEY
api_model = magistral-medium-latest
reasoning_param = think

# Example: a Mistral-hosted non-reasoning model — send no reasoning field.
[mistral-small]
api_url = https://api.mistral.ai/v1/chat/completions
api_key = YOUR_MISTRAL_API_KEY
api_model = mistral-small-latest
reasoning_param = none

# Example: Mistral Large on NVIDIA NIM. The NIM gateway hard-400s when
# reasoning_effort is re-sent on follow-up requests that replay the
# ThinkChunk/TextChunk history, so send it only on the first request.
[mistral-large-nvidia]
api_url = https://integrate.api.nvidia.com/v1/chat/completions
api_key = YOUR_NVIDIA_API_KEY
api_model = mistralai/mistral-large-4-1t-a52b
once reasoning_effort = high

# Example: a long-context, expensive model with pricing (USD per 1M tokens),
# so /usage can estimate the session cost.
[kimi-k3]
api_url = https://api.moonshot.ai/v1/chat/completions
api_key = YOUR_MOONSHOT_API_KEY
api_model = kimi-k3
max_output_tokens = 262144
price_input = 2.0
price_output = 10.0
price_cached_read = 0.2

# Example: override a default for a single model.
[cloud-fast]
api_url = https://api.example.com/v1/chat/completions
api_key = YOUR_EXAMPLE_API_KEY
api_model = fast-model
reasoning_effort = low
tool_choice = none
temperature = 0.3
