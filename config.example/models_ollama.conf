# Per-model parameters for Ollama models
# [default] applies to every model; a named section overrides it.
# Keys: temperature, top_p, top_k, frequency_penalty, presence_penalty,
#   max_output_tokens, reasoning_effort (low/medium/high/on/off), seed,
#   num_ctx (context window in tokens, Ollama only)

[default]
temperature = 1
top_p = 0.9
top_k = 40
frequency_penalty = 0
presence_penalty = 0

# Coder models tend to do better at a lower temperature.
[llama3.2:3b]
temperature = 0.7
reasoning_effort = medium

# Explicit context window and seed for one model.
[qwen3:8b]
max_output_tokens = 8192
num_ctx = 32768
seed = 42
