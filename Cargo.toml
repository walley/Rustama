[package]
name = "rustama"
version = "0.2.0"
edition = "2024"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
ratatui-textarea = "0.9"
pulldown-cmark = "0.10"
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
tokio = { version = "1.37", features = ["full"] }
marked = "0.3"
dialoguer = "0.12.0"
markdown = "0.1"
glob = "0.3"
regex = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
arboard = "3"
x11rb = "0.13"
chrono = "0.4"
urlencoding = "2"
portable-pty = "0.9.0"
vt100 = "0.16.2"
