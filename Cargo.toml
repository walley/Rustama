[package]
name = "ollama-tui"
version = "0.6.0"
edition = "2021"

[dependencies]
ratatui = "0.23"
crossterm = "0.27"
tokio = { version = "1.34", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
syntect = "5.0"
ratatui-markdown = "0.3"
